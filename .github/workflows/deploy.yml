name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  images:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      WEB_URL: ${{ vars.WEB_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${REGISTRY:?在 repo Variables 设 IMAGE_REGISTRY，如 ghcr.io/owner}"
          for app in api web admin; do
            extra=()
            if [[ "$app" != api ]]; then
              extra+=(
                --build-arg API_INTERNAL_URL=http://api:3000
                --build-arg NEXT_PUBLIC_WEB_URL="$WEB_URL"
                --build-arg NEXT_PUBLIC_ADMIN_URL="$ADMIN_URL"
                --build-arg NEXT_PUBLIC_API_URL=/api
                --build-arg NEXT_PUBLIC_ADMIN_API_URL=/api
              )
            fi
            docker build "${extra[@]}" \
              -f "infra/docker/Dockerfile.$app" \
              -t "$REGISTRY/sister-netdisk-$app:$TAG" \
              -t "$REGISTRY/sister-netdisk-$app:latest" .
            docker push "$REGISTRY/sister-netdisk-$app:$TAG"
            docker push "$REGISTRY/sister-netdisk-$app:latest"
          done
      - name: Ship compose and release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/sister-netdisk
            ./deploy.sh all ${{ github.sha }}
