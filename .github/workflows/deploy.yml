name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  images:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push web
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${REGISTRY:?在 repo Variables 设 IMAGE_REGISTRY，如 ghcr.io/owner}"
          docker build \
            --build-arg NEXT_PUBLIC_WEB_URL="$WEB_URL" \
            --build-arg PANSOU_URL=http://pansou:8888 \
            -f infra/docker/Dockerfile.web \
            -t "$REGISTRY/sister-netdisk-web:$TAG" \
            -t "$REGISTRY/sister-netdisk-web:latest" .
          docker push "$REGISTRY/sister-netdisk-web:$TAG"
          docker push "$REGISTRY/sister-netdisk-web:latest"
      - name: Ship compose and release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/sister-netdisk
            ./deploy.sh all ${{ github.sha }}
