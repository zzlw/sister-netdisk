# Railway API 服务：Settings → Config-as-code 指到本文件。
# 密钥只写控制台，不要提交。

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"
watchPatterns = [
  "apps/api/**",
  "packages/db/**",
  "packages/shared/**",
  "infra/docker/Dockerfile.api",
  "infra/railway/start-api.sh",
]

[deploy]
startCommand = "/usr/local/bin/start-api.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
