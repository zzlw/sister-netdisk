name: sister-netdisk

services:
  pansou:
    # 锁定官方 API（不要 pansou-web）。不要 ports，只给 web 内网访问。
    # tag 对应 fish2018/pansou@f6c3041（2026-09-10）；digest 是该构建的 multi-arch index。
    image: ghcr.io/fish2018/pansou:sha-f6c3041@sha256:0951534e40a644a2b5777144df0684dae729d536b02925b661b9b6da0aa14099
    restart: unless-stopped
    mem_limit: 1024m
    env_file:
      - ./pansou.env
    environment:
      PORT: "8888"
    volumes:
      - pansou_cache:/cache
    expose:
      - "8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8888/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    image: ${IMAGE_REGISTRY}/sister-netdisk-web:${WEB_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      PANSOU_URL: http://pansou:8888
      PANSOU_TIMEOUT_MS: "30000"
      SHARE_CHECK_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      pansou:
        condition: service_started
    expose:
      - "3000"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      BASE_DOMAIN: ${BASE_DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/entrypoint.d/90-periodic-reload.sh:/docker-entrypoint.d/90-periodic-reload.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - pansou

  acme:
    image: sister-netdisk-acme:prod
    build: ./acme
    restart: unless-stopped
    command: daemon
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      Ali_Key: ${ALI_KEY:-}
      Ali_Secret: ${ALI_SECRET:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
    volumes:
      - acme-data:/acme.sh
      - ./nginx/certs:/certs
      - ./acme:/scripts:ro

volumes:
  acme-data:
  pansou_cache:
