# 应用跑在宿主机，依赖跑在容器。
# pnpm pansou:up 起搜索引擎。本地对象存储用 RustFS（S3 兼容）。
name: sister-netdisk

services:
  rustfs_perms:
    image: busybox:1.37
    profiles: ["storage"]
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - rustfs_data:/data
    networks:
      - dev

  pansou:
    # 锁定官方 API（不要 pansou-web）。不跟 latest 盲升。
    # tag 对应 fish2018/pansou@f6c3041（2026-09-10）；digest 是该构建的 multi-arch index。
    image: ghcr.io/fish2018/pansou:sha-f6c3041@sha256:0951534e40a644a2b5777144df0684dae729d536b02925b661b9b6da0aa14099
    container_name: sister-netdisk_pansou_dev
    restart: unless-stopped
    ports:
      - "${PANSOU_HOST_PORT}:8888"
    env_file:
      - ./pansou.env
    volumes:
      - pansou_cache:/cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8888/api/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - dev

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    profiles: ["storage"]
    container_name: sister-netdisk_rustfs_dev
    restart: unless-stopped
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    ports:
      - "${S3_HOST_PORT}:9000"
      - "${S3_CONSOLE_PORT}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_ACCESS_KEY_SECRET}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${NEXT_PUBLIC_WEB_URL}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dev

volumes:
  rustfs_data:
    name: sister-netdisk_rustfs_data
  pansou_cache:
    name: sister-netdisk_pansou_cache

networks:
  dev:
    name: sister-netdisk_dev
    driver: bridge
